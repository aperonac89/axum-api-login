[package]
name = "axum-api-login"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "0.6.0", fetures = ["password-hash", "getrandom"] }
axum = "0.8.9"
jsonwebtoken = "11.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = "0.9.0"
tokio = { version = "1.54.1", features = ["full"] }
